{% extends "base.html" %}
{% block titulo %}Bater Ponto{% endblock %}
{% block conteudo %}
<div class="ponto-wrap">

  <div class="ponto-clock-card">
    <div class="ponto-clock-label">Horário de Brasília</div>
    <div class="ponto-clock" id="relogio">--:--:--</div>
    <div class="ponto-data" id="data-atual">—</div>
  </div>

  <div class="card card-aviso" id="banner-lembrete" style="display:none; width:100%; text-align:center;">
    <p style="margin:0; color:#92400e; font-weight:600; font-size:14px;" id="banner-lembrete-texto">
      ⏰ Você ainda não bateu o ponto hoje!
    </p>
  </div>

  <div class="card ponto-card">
    <h2>Registrar Ponto</h2>
    <p class="ponto-instrucao">Posicione seu rosto na câmera e clique em "Bater Ponto".</p>

    <div class="camera-frame">
      <video id="video" autoplay playsinline></video>
      <canvas id="canvas" width="320" height="240" style="display:none;"></canvas>
    </div>

    <div class="status-linha">
      <span class="status-chip" id="chip-localizacao">
        <span class="status-dot pendente"></span> Obtendo localização...
      </span>
    </div>

    <button id="btn-registrar" class="btn-primario" disabled>Bater Ponto</button>
    <p id="resultado" class="resultado-msg"></p>

    <button type="button" id="btn-lembrete" class="btn-secundario">🔔 Ativar lembrete no navegador</button>
    <p id="aviso-ios" class="ponto-instrucao" style="display:none; color:#92400e; font-weight:500;"></p>
  </div>
</div>

<script>
// Relógio ao vivo — sempre no horário de Brasília, independente do fuso do dispositivo
function atualizarRelogio() {
  const agora = new Date();
  const opcoesHora = { timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', second: '2-digit', hour12: false };
  const opcoesData = { timeZone: 'America/Sao_Paulo', weekday: 'long', day: '2-digit', month: 'long', year: 'numeric' };
  document.getElementById('relogio').textContent = new Intl.DateTimeFormat('pt-BR', opcoesHora).format(agora);
  document.getElementById('data-atual').textContent = new Intl.DateTimeFormat('pt-BR', opcoesData).format(agora);
}
atualizarRelogio();
setInterval(atualizarRelogio, 1000);

let latitude = null;
let longitude = null;
const video = document.getElementById('video');
const canvas = document.getElementById('canvas');
const btnRegistrar = document.getElementById('btn-registrar');
const chipLocalizacao = document.getElementById('chip-localizacao');
const resultado = document.getElementById('resultado');

// Câmera
navigator.mediaDevices.getUserMedia({ video: true })
  .then(stream => { video.srcObject = stream; })
  .catch(() => {
    resultado.textContent = 'Não foi possível acessar a câmera.';
    resultado.className = 'resultado-msg erro';
  });

// Geolocalização
if (navigator.geolocation) {
  navigator.geolocation.getCurrentPosition(
    pos => {
      latitude = pos.coords.latitude;
      longitude = pos.coords.longitude;
      chipLocalizacao.innerHTML = '<span class="status-dot ok"></span> Localização obtida';
      btnRegistrar.disabled = false;
    },
    () => {
      chipLocalizacao.innerHTML = '<span class="status-dot erro"></span> Não foi possível obter a localização';
    }
  );
} else {
  chipLocalizacao.innerHTML = '<span class="status-dot erro"></span> Geolocalização não suportada neste navegador';
}

let registrosHojeCount = {{ registros_hoje_count }};

btnRegistrar.addEventListener('click', () => {
  const ctx = canvas.getContext('2d');
  ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
  const foto = canvas.toDataURL('image/jpeg', 0.8);

  btnRegistrar.disabled = true;
  resultado.className = 'resultado-msg';
  resultado.textContent = 'Registrando...';

  fetch('/api/registrar-ponto', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ foto, latitude, longitude })
  })
    .then(r => r.json())
    .then(data => {
      resultado.textContent = data.mensagem;
      resultado.className = data.ok ? 'resultado-msg sucesso' : 'resultado-msg erro';
      btnRegistrar.disabled = false;
      if (data.ok) {
        registrosHojeCount = data.registros_hoje_count;
        proximoLembreteEm = 0; // permite lembrete imediato de novo se a próxima pendência já valer a pena
        verificarLembrete();
      }
    })
    .catch(() => {
      resultado.textContent = 'Erro ao registrar o ponto.';
      resultado.className = 'resultado-msg erro';
      btnRegistrar.disabled = false;
    });
});

// ---------------------------------------------------------------------------
// Lembrete simples: aviso na tela + notificação do navegador (enquanto a aba
// estiver aberta). Não requer servidor de push; funciona só localmente.
//
// Regra definida pelo gestor em /gestor/configuracoes:
// - Depois do horário de ENTRADA, se ainda não bateu nenhum ponto hoje, lembra
//   a cada X minutos.
// - Depois do horário de SAÍDA, se já entrou mas não bateu a saída (nº ímpar
//   de batidas hoje), também lembra a cada X minutos.
// - Assim que a pendência é resolvida, os lembretes daquele tipo param.
// ---------------------------------------------------------------------------
const HORARIO_ENTRADA = "{{ horario_entrada }}";
const HORARIO_SAIDA = "{{ horario_saida }}";
const INTERVALO_LEMBRETE_MS = {{ intervalo_lembrete_minutos }} * 60 * 1000;

const btnLembrete = document.getElementById('btn-lembrete');
const avisoIOS = document.getElementById('aviso-ios');
const bannerLembrete = document.getElementById('banner-lembrete');
const bannerLembreteTexto = document.getElementById('banner-lembrete-texto');
let proximoLembreteEm = 0; // timestamp (Date.now()) em que o próximo lembrete pode disparar

const ehIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
const rodandoInstalado = window.navigator.standalone === true
  || window.matchMedia('(display-mode: standalone)').matches;

if (!('Notification' in window)) {
  // iOS Safari não expõe a API de notificação em abas normais — só funciona
  // quando o site é instalado na Tela de Início.
  btnLembrete.style.display = 'none';
  if (ehIOS && !rodandoInstalado) {
    avisoIOS.style.display = 'block';
    avisoIOS.innerHTML = '📱 Para receber lembretes no iPhone: toque em <strong>Compartilhar</strong> (ícone de quadrado com seta) → <strong>Adicionar à Tela de Início</strong>. Depois abra o app pelo ícone criado (não pelo Safari).';
  }
} else if (ehIOS && !rodandoInstalado) {
  // Tem a API mas está rodando dentro do Safari normal (não instalado) — no iOS
  // isso normalmente não entrega notificações de forma confiável.
  avisoIOS.style.display = 'block';
  avisoIOS.innerHTML = '📱 Para os lembretes funcionarem de forma confiável no iPhone, adicione este app à Tela de Início: toque em <strong>Compartilhar</strong> → <strong>Adicionar à Tela de Início</strong> e abra por lá.';
}

btnLembrete.addEventListener('click', () => {
  Notification.requestPermission().then(permissao => {
    if (permissao === 'granted') {
      btnLembrete.textContent = '🔔 Lembretes ativados';
      btnLembrete.disabled = true;
      dispararNotificacao('Você será avisado se esquecer de bater o ponto.');
    }
  });
});

function dispararNotificacao(texto) {
  if (!('Notification' in window) || Notification.permission !== 'granted') return;

  // Usa o service worker sempre que possível — é o único jeito que funciona no iOS,
  // e também funciona normalmente no Android/desktop.
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.ready.then(reg => {
      reg.showNotification('Lembrete de ponto', {
        body: texto,
        icon: '/static/icons/icon-192.png',
        badge: '/static/icons/icon-192.png',
      });
    }).catch(() => {
      new Notification('Lembrete de ponto', { body: texto });
    });
  } else {
    new Notification('Lembrete de ponto', { body: texto });
  }
}

function verificarLembrete() {
  const agora = new Date();
  const horaAtualStr = new Intl.DateTimeFormat('pt-BR', {
    timeZone: 'America/Sao_Paulo', hour: '2-digit', minute: '2-digit', hour12: false
  }).format(agora);

  let pendencia = null; // 'entrada' | 'saida' | null

  if (registrosHojeCount === 0 && horaAtualStr >= HORARIO_ENTRADA) {
    pendencia = 'entrada';
  } else if (registrosHojeCount % 2 === 1 && horaAtualStr >= HORARIO_SAIDA) {
    pendencia = 'saida';
  }

  if (!pendencia) {
    bannerLembrete.style.display = 'none';
    return;
  }

  const texto = pendencia === 'entrada'
    ? '⏰ Você ainda não bateu a ENTRADA hoje!'
    : '⏰ Você ainda não bateu a SAÍDA hoje!';

  bannerLembreteTexto.textContent = texto;
  bannerLembrete.style.display = 'block';

  if (Date.now() >= proximoLembreteEm) {
    dispararNotificacao(texto.replace('⏰ ', ''));
    proximoLembreteEm = Date.now() + INTERVALO_LEMBRETE_MS;
  }
}
verificarLembrete();
setInterval(verificarLembrete, 60000);
</script>
{% endblock %}
