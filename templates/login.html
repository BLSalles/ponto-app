{% extends "base.html" %}
{% block titulo %}Login{% endblock %}
{% block conteudo %}
<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <span class="login-logo">
        {% if marca.logo_header_base64 %}
          <img src="{{ marca.logo_header_base64 }}" alt="{{ marca.nome_empresa }}">
        {% else %}
          <svg viewBox="0 0 24 24" width="52" height="52" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9.2" stroke="{{ marca.cor_primaria }}" stroke-width="1.6"/>
            <path d="M12 7v5l3.3 1.9" stroke="{{ marca.cor_primaria }}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <h1 class="login-nome-empresa">{{ marca.nome_empresa }}</h1>
        {% endif %}
      </span>
      <p>Controle de Ponto — Acesse com suas credenciais corporativas</p>
    </div>
    <form method="POST" class="login-form">
      <label>E-mail</label>
      <input type="email" name="email" required autofocus placeholder="seu.email@empresa.com">

      <label>Senha</label>
      <input type="password" name="senha" required placeholder="••••••••">

      <button type="submit">Entrar</button>
    </form>
  </div>
</div>
{% endblock %}
