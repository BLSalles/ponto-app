services:
  - type: web
    name: ponto-app
    env: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GESTOR_EMAIL
        value: gestor@empresa.com
      - key: GESTOR_SENHA
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ponto-db
          property: connectionString
      # Assistente do gestor (perguntas por voz/texto). Preencha a chave no
      # painel do Render; sem ela o app roda igual, só com o assistente desligado.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5-20251001

databases:
  - name: ponto-db
    plan: free
