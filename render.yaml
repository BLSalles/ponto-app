services:
  - type: web
    name: ponto-app
    env: docker
    plan: free
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: GESTOR_EMAIL
        value: gestor@empresa.com
      - key: GESTOR_SENHA
        sync: false
      # Token(s) da API externa (/api/v1/...). Defina o valor no painel do Render.
      # Vários tokens separados por vírgula = um por sistema que consome, dá pra
      # revogar um sem derrubar os outros. Sem essa variável a API fica desligada.
      - key: API_TOKENS
        sync: false
      # Opcional: chave do LocationIQ (plano gratuito, 5k req/dia). Sem ela o app usa os
      # servidores públicos (Nominatim/Photon), que no IP compartilhado do Render devolvem
      # 429 com frequência e deixam alguns registros sem endereço.
      - key: LOCATIONIQ_API_KEY
        sync: false
      # Rigidez do reconhecimento facial na batida do ponto (0.30 a 0.70; padrão 0.55).
      # Quanto MENOR, mais rígido. Se os colaboradores estiverem apanhando pra bater o
      # ponto, suba de 0.05 em 0.05 — o log do Render imprime a distância real de cada
      # tentativa ("[facial] Rejeitado: ... distância=0.5831"), então dá pra calibrar em
      # cima dos números em vez de chutar.
      - key: FACE_MATCH_TOLERANCE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: ponto-db
          property: connectionString

databases:
  - name: ponto-db
    plan: free
